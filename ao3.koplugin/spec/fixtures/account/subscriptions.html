<!DOCTYPE html>
<html>
  <body class="logged-in">
    <div id="main">
      <!-- Captured shape of /users/<name>/subscriptions: the heading has no
           count, one <dt> per entry, and the unsubscribe form in its <dd>. -->
      <h2 class="heading">My Subscriptions</h2>
      <h3 class="landmark heading">Navigation</h3>
      <ul class="navigation actions" role="navigation">
        <li><span class="current">All Subscriptions</span></li>
        <li><a href="/users/testuser/subscriptions?type=series">Series Subscriptions</a></li>
        <li><a href="/users/testuser/subscriptions?type=users">User Subscriptions</a></li>
        <li><a href="/users/testuser/subscriptions?type=works">Work Subscriptions</a></li>
        <li><a href="/users/testuser/subscriptions/confirm_delete_all">Delete All Subscriptions</a></li>
      </ul>
      <h3 class="landmark heading">List of Subscriptions</h3>
      <dl class="subscription index group">
        <dt>
          <a href="/works/111">A Subscribed Work</a>
          (Work)
          by <a rel="author" href="/users/authorone">Author One</a>
        </dt>
        <dd>
          <form class="button_to" method="post" action="/users/testuser/subscriptions/501">
            <input type="hidden" name="_method" value="delete" />
            <input type="submit" value="Unsubscribe from A Subscribed Work" />
          </form>
        </dd>
        <dt>
          <a href="/series/222">A Subscribed Series</a>
          (Series)
          by <a rel="author" href="/users/authortwo">Author Two</a>
        </dt>
        <dd>
          <form class="button_to" method="post" action="/users/testuser/subscriptions/502">
            <input type="hidden" name="_method" value="delete" />
            <input type="submit" value="Unsubscribe from A Subscribed Series" />
          </form>
        </dd>
        <dt>
          <a href="/users/authorthree">Author Three</a>
        </dt>
        <dd>
          <form class="button_to" method="post" action="/users/testuser/subscriptions/503">
            <input type="hidden" name="_method" value="delete" />
            <input type="submit" value="Unsubscribe from Author Three" />
          </form>
        </dd>
      </dl>
    </div>
  </body>
</html>
